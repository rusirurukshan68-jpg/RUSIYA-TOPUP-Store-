<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="monetag" content="cb18c347f4b726e68fcaf8e16038828e">
<title>RUSIYA MODZ - Official Store</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0f0f5;--card:rgba(255,255,255,0.7);--text:#1a1a2e;--text2:#555;--border:rgba(138,92,255,0.2);--purple:#8A5CFF;--blue:#3B82F6;--green:#22C55E;--red:#EF4444;--yellow:#FBBF24;--cyan:#06B6D4;--pink:#EC4899;--nav-bg:rgba(255,255,255,0.85)}
[data-theme="dark"]{--bg:#050816;--card:rgba(20,20,40,0.7);--text:#e0e0ff;--text2:#aaa;--border:rgba(138,92,255,0.3);--nav-bg:rgba(10,10,30,0.9)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Poppins',sans-serif;background:var(--bg);color:var(--text);max-width:480px;margin:0 auto;min-height:100vh;overflow-x:hidden;transition:background .3s,color .3s}
::-webkit-scrollbar{width:0;height:0}
.orb{font-family:'Orbitron',sans-serif}
.glass{background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:20px}
.btn{padding:12px 24px;border:none;border-radius:14px;font-family:'Poppins',sans-serif;font-weight:600;font-size:14px;cursor:pointer;transition:transform .15s,box-shadow .2s;color:#fff;width:100%}
.btn:active{transform:scale(0.96)}
.btn-purple{background:linear-gradient(135deg,#8A5CFF,#6C3AE0)}
.btn-green{background:linear-gradient(135deg,#22C55E,#16A34A)}
.btn-red{background:linear-gradient(135deg,#EF4444,#DC2626)}
.btn-blue{background:linear-gradient(135deg,#3B82F6,#2563EB)}
.btn-cyan{background:linear-gradient(135deg,#06B6D4,#0891B2)}
.btn-gray{background:linear-gradient(135deg,#6B7280,#4B5563)}
.btn-gold{background:linear-gradient(135deg,#FBBF24,#F59E0B);color:#1a1a2e}

/* Loading Screen */
#loadScreen{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at center,rgba(138,92,255,0.3),#050816 70%)}
#loadScreen img{width:100px;height:100px;border-radius:50%;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
#loadScreen h1{font-family:'Orbitron',sans-serif;color:#fff;font-size:24px;margin-top:16px}
#loadScreen p{color:#aaa;font-size:12px;letter-spacing:3px;margin-top:4px}
.progress-bar{width:200px;height:4px;background:rgba(255,255,255,0.1);border-radius:4px;margin-top:30px;overflow:hidden;position:relative}
.progress-fill{height:100%;background:linear-gradient(90deg,#8A5CFF,#06B6D4);border-radius:4px;width:0%;transition:width .3s;position:relative}
.progress-fill::after{content:'';position:absolute;right:0;top:-3px;width:10px;height:10px;background:#06B6D4;border-radius:50%;box-shadow:0 0 10px #06B6D4,0 0 20px #06B6D4}

/* Toast */
#toastC{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:10000;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{padding:12px 20px;border-radius:14px;color:#fff;font-size:13px;font-weight:500;animation:toastIn .4s cubic-bezier(.34,1.56,.64,1);pointer-events:auto;text-align:center;max-width:340px;box-shadow:0 4px 20px rgba(0,0,0,0.3)}
.toast.out{animation:toastOut .3s ease forwards}
.toast-purple{background:linear-gradient(135deg,#8A5CFF,#6C3AE0)}
.toast-green{background:linear-gradient(135deg,#22C55E,#16A34A)}
.toast-red{background:linear-gradient(135deg,#EF4444,#DC2626)}
@keyframes toastIn{0%{opacity:0;transform:translateY(-30px) scale(0.8)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes toastOut{to{opacity:0;transform:translateY(-20px) scale(0.8)}}

/* Page Animations */
.page{display:none;padding:0 16px 100px;animation:fadeUp .4s ease}
.page.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* Header */
#header{position:sticky;top:0;z-index:100;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;background:var(--nav-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
#header .left{display:flex;align-items:center;gap:10px}
#header .left img{width:36px;height:36px;border-radius:50%}
#header .left .info h2{font-family:'Orbitron',sans-serif;font-size:13px;color:var(--purple);line-height:1.2}
#header .left .info p{font-size:9px;color:var(--text2);letter-spacing:1px}
#header .right{display:flex;gap:12px;align-items:center}
#header .right button{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text)}

/* Bottom Nav */
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;z-index:100;background:var(--nav-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);padding:6px 0 env(safe-area-inset-bottom,8px)}
#nav .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;cursor:pointer;position:relative;border:none;background:none;color:var(--text2);font-size:10px;font-family:'Poppins',sans-serif;transition:color .2s}
#nav .tab.active{color:var(--purple)}
#nav .tab.active::before{content:'';position:absolute;top:0;width:30px;height:3px;background:var(--purple);border-radius:0 0 3px 3px}
#nav .tab span{font-size:20px}

/* WhatsApp FAB */
#waFab{position:fixed;bottom:75px;right:16px;z-index:99;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#22C55E,#16A34A);display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 4px 15px rgba(34,197,94,0.4);cursor:pointer;animation:fabPulse 2s infinite;border:none;text-decoration:none}
@keyframes fabPulse{0%,100%{box-shadow:0 4px 15px rgba(34,197,94,0.4)}50%{box-shadow:0 4px 25px rgba(34,197,94,0.7)}}

/* Registration */
#regScreen{position:fixed;inset:0;z-index:9998;background:var(--bg);display:none;flex-direction:column;align-items:center;padding:40px 24px;overflow-y:auto}
.step-indicator{display:flex;align-items:center;gap:0;margin:20px 0}
.step-dot{width:12px;height:12px;border-radius:50%;background:rgba(138,92,255,0.2);transition:.3s}
.step-dot.active{background:var(--purple);box-shadow:0 0 10px rgba(138,92,255,0.5)}
.step-line{width:40px;height:2px;background:rgba(138,92,255,0.2)}
.step-line.active{background:var(--purple)}
.reg-card{width:100%;padding:24px;margin-top:16px}
.photo-upload{width:90px;height:90px;border-radius:50%;border:2px dashed var(--purple);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;cursor:pointer;font-size:30px;overflow:hidden;background:var(--card)}
.photo-upload img{width:100%;height:100%;object-fit:cover}
.input-group{margin-bottom:14px}
.input-group label{font-size:12px;color:var(--text2);margin-bottom:4px;display:block}
.input-group input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--text);font-family:'Poppins',sans-serif;font-size:14px;outline:none;transition:border .2s}
.input-group input:focus{border-color:var(--purple)}
.pin-boxes{display:flex;gap:12px;justify-content:center;margin:20px 0}
.pin-box{width:50px;height:55px;text-align:center;font-family:'Orbitron',sans-serif;font-size:22px;border:2px solid var(--border);border-radius:14px;background:var(--card);color:var(--text);outline:none;-webkit-text-security:disc}
.pin-box:focus{border-color:var(--purple);box-shadow:0 0 10px rgba(138,92,255,0.3)}

/* Home */
.welcome-banner{padding:20px;margin:16px 0;position:relative;overflow:hidden}
.welcome-banner::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 20% 50%,rgba(138,92,255,0.15),transparent 60%);animation:glowPulse 3s ease infinite}
@keyframes glowPulse{0%,100%{opacity:0.5}50%{opacity:1}}
.welcome-banner h2{font-family:'Orbitron',sans-serif;font-size:14px}
.welcome-banner p{font-size:20px;font-weight:700;margin-top:4px}
.section-title{font-family:'Orbitron',sans-serif;font-size:13px;margin:20px 0 12px;color:var(--purple)}
.store-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.store-card{border-radius:20px;overflow:hidden;cursor:pointer;transition:transform .2s;position:relative}
.store-card:active{transform:scale(0.96)}
.store-card img{width:100%;height:110px;object-fit:cover}
.store-card .info{padding:10px;background:var(--card)}
.store-card .info h3{font-size:12px;font-weight:600}
.store-card .info p{font-size:10px;color:var(--text2)}
.badge{position:absolute;top:8px;right:8px;padding:3px 8px;border-radius:8px;font-size:9px;font-weight:700;color:#fff;z-index:2}
.badge-red{background:var(--red)}
.badge-gold{background:linear-gradient(135deg,#FBBF24,#F59E0B);color:#1a1a2e}
.badge-cyan{background:var(--cyan)}
.badge-green{background:var(--green)}
.badge-purple{background:var(--purple)}

/* Store Pages */
.store-header{display:flex;align-items:center;gap:12px;padding:16px 0}
.store-header button{background:none;border:none;font-size:22px;cursor:pointer;color:var(--text)}
.store-header h2{font-family:'Orbitron',sans-serif;font-size:15px}
.step-bar{display:flex;align-items:center;justify-content:center;gap:0;margin:10px 0 20px}
.s-dot{width:10px;height:10px;border-radius:50%;background:rgba(138,92,255,0.2);transition:.3s}
.s-dot.active{background:var(--purple);box-shadow:0 0 8px rgba(138,92,255,0.5)}
.s-line{width:30px;height:2px;background:rgba(138,92,255,0.15)}
.s-line.active{background:var(--purple)}
.uid-input{width:100%;padding:14px;text-align:center;font-family:'Orbitron',sans-serif;font-size:20px;border:2px solid var(--border);border-radius:16px;background:var(--card);color:var(--text);outline:none}
.uid-input:focus{border-color:var(--purple)}
.cat-tabs{display:flex;gap:8px;overflow-x:auto;padding:8px 0;margin-bottom:12px}
.cat-tab{padding:8px 16px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text2);transition:.2s}
.cat-tab.active{background:var(--purple);color:#fff;border-color:var(--purple)}
.item-card{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:10px}
.item-card img{width:50px;height:50px;border-radius:12px;object-fit:cover}
.item-info{flex:1}
.item-info h4{font-size:13px;font-weight:600}
.item-info .price{font-size:14px;font-weight:700;color:var(--purple)}
.item-info .old-price{font-size:11px;color:var(--text2);text-decoration:line-through;margin-left:6px}
.qty-ctrl{display:flex;align-items:center;gap:8px}
.qty-btn{width:30px;height:30px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.qty-num{font-weight:600;font-size:14px;min-width:20px;text-align:center}
.cart-summary{position:sticky;bottom:80px;padding:14px;margin-top:12px;z-index:10}
.cart-summary .total{font-family:'Orbitron',sans-serif;font-size:18px;color:var(--purple)}
.pay-card{padding:16px;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:.2s;position:relative}
.pay-card.selected{border-color:var(--purple);box-shadow:0 0 15px rgba(138,92,255,0.3)}
.pay-card .check{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;transition:.2s}
.pay-card.selected .check{background:var(--purple);border-color:var(--purple);color:#fff}
.pay-card img{width:40px;height:40px;border-radius:10px;object-fit:cover}
.order-summary{padding:16px}
.order-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.order-total{font-family:'Orbitron',sans-serif;font-size:18px;color:var(--purple);text-align:right;padding-top:12px}

/* PIN Modal */
#pinModal{position:fixed;inset:0;z-index:10001;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;padding:24px}
#pinModal .modal-card{background:var(--card);backdrop-filter:blur(20px);border-radius:20px;padding:30px 24px;width:100%;max-width:320px;text-align:center}
#pinModal .pin-boxes input{-webkit-text-security:disc}
#pinModal .pin-err{color:var(--red);font-size:12px;min-height:18px;margin-top:8px}

/* Wallet */
.wallet-card{padding:20px;margin-bottom:14px;cursor:pointer;position:relative;overflow:hidden}
.wallet-card .bal{font-family:'Orbitron',sans-serif;font-size:24px;color:#fff}
.wallet-card.hnb{background:linear-gradient(135deg,#3B82F6,#1D4ED8)}
.wallet-card.ez{background:linear-gradient(135deg,#EF4444,#DC2626)}
.wallet-card.offer{background:linear-gradient(135deg,#8A5CFF,#EC4899)}
.wallet-card .wlogo{width:40px;height:40px;border-radius:10px;position:absolute;top:14px;right:14px;object-fit:cover}
.wallet-card h3{color:rgba(255,255,255,0.9);font-size:13px;margin-bottom:4px}
.wallet-card p{color:rgba(255,255,255,0.6);font-size:10px;margin-top:4px}

.deposit-card{padding:20px;margin-top:12px}
.deposit-card .acc-info{background:rgba(138,92,255,0.1);padding:12px;border-radius:12px;margin:12px 0;font-size:12px}
.ref-input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--text);font-family:'Poppins',sans-serif;font-size:14px;outline:none;-webkit-text-security:disc}
.ref-input:focus{border-color:var(--purple)}

/* History */
.order-card{padding:14px;margin-bottom:10px}
.order-card .type{font-size:11px;color:var(--purple);font-weight:600;text-transform:uppercase}
.order-card .items{font-size:13px;margin:4px 0}
.order-card .meta{font-size:11px;color:var(--text2)}
.status-badge{padding:3px 10px;border-radius:8px;font-size:10px;font-weight:600;color:#fff;display:inline-block}
.status-pending{background:var(--yellow);color:#1a1a2e}
.status-complete{background:var(--green)}
.type-badge{padding:2px 8px;border-radius:6px;font-size:9px;font-weight:600;color:#fff;display:inline-block;margin-left:6px}

/* Settings */
.settings-section{margin:16px 0}
.settings-section h3{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;padding-left:4px}
.settings-item{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;margin-bottom:2px;cursor:pointer;border-radius:14px;background:var(--card);border:1px solid var(--border);transition:.2s}
.settings-item:active{transform:scale(0.98)}
.settings-item .left{display:flex;align-items:center;gap:12px}
.settings-item .left span{font-size:20px}
.settings-item .left div h4{font-size:14px}
.settings-item .left div p{font-size:11px;color:var(--text2)}
.settings-item .arrow{color:var(--text2)}
.theme-toggles{display:flex;gap:8px}
.theme-btn{padding:8px 16px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:12px;font-weight:600;cursor:pointer;transition:.2s}
.theme-btn.active{background:var(--purple);color:#fff;border-color:var(--purple)}

/* VPN */
.vpn-card{padding:16px;margin-bottom:12px;cursor:pointer;overflow:hidden}
.vpn-card img{width:100%;height:120px;object-fit:cover;border-radius:14px;margin-bottom:10px}
.vpn-type-sel{display:flex;gap:10px;margin:12px 0}
.vpn-type-card{flex:1;padding:20px 14px;text-align:center;cursor:pointer;transition:.2s}
.vpn-type-card.selected{border-color:var(--purple);box-shadow:0 0 15px rgba(138,92,255,0.3)}
.isp-group{margin-bottom:16px}
.isp-group h4{font-size:13px;font-weight:600;margin-bottom:8px;color:var(--purple)}
.pkg-card{padding:12px;margin-bottom:8px;cursor:pointer;transition:.2s}
.pkg-card.selected{border-color:var(--purple);box-shadow:0 0 10px rgba(138,92,255,0.2)}
.gb-card{padding:14px;margin-bottom:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.gb-card.selected{border-color:var(--purple);box-shadow:0 0 10px rgba(138,92,255,0.2)}

/* Offer */
.countdown{font-family:'Orbitron',sans-serif;font-size:20px;color:var(--cyan);margin:10px 0}
.event-progress{width:100%;height:8px;background:rgba(138,92,255,0.1);border-radius:4px;overflow:hidden;margin:10px 0}
.event-progress .fill{height:100%;background:linear-gradient(90deg,#8A5CFF,#22C55E);border-radius:4px;transition:width .3s}
.step-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}
.step-item{padding:10px 0;text-align:center;border-radius:12px;font-size:12px;font-weight:600;cursor:pointer;transition:.2s;border:1px solid var(--border);background:var(--card)}
.step-item.done{background:var(--green);color:#fff;border-color:var(--green)}
.step-item.current{background:rgba(138,92,255,0.15);border-color:var(--purple);color:var(--purple);animation:pulse 1.5s infinite}
.step-item.locked{opacity:0.4;cursor:default}

/* VPN Warning */
.vpn-warn{position:fixed;inset:0;z-index:10002;background:rgba(239,68,68,0.95);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;text-align:center;color:#fff}
.vpn-warn h2{font-family:'Orbitron',sans-serif;font-size:20px;margin:16px 0}

/* Account Details */
.profile-section{text-align:center;padding:24px}
.profile-section img{width:80px;height:80px;border-radius:50%;object-fit:cover;border:3px solid var(--purple);margin-bottom:12px}
.profile-section h2{font-size:18px;font-weight:600}
.profile-section p{font-size:12px;color:var(--text2)}
.bal-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:16px 0}
.bal-item{text-align:center;padding:14px 8px;border-radius:14px;background:var(--card);border:1px solid var(--border)}
.bal-item .amt{font-family:'Orbitron',sans-serif;font-size:14px;color:var(--purple);margin-top:4px}
.bal-item .lbl{font-size:10px;color:var(--text2)}

/* RGB Theme */
[data-theme="rgb"] .glass,[data-theme="rgb"] #header,[data-theme="rgb"] #nav{animation:rgbBorder 3s linear infinite}
@keyframes rgbBorder{0%{border-color:#8A5CFF}16%{border-color:#3B82F6}33%{border-color:#06B6D4}50%{border-color:#22C55E}66%{border-color:#FBBF24}83%{border-color:#EC4899}100%{border-color:#8A5CFF}}

/* Confirm Dialog */
#confirmDlg{position:fixed;inset:0;z-index:10001;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;padding:24px}
#confirmDlg .modal-card{background:var(--card);backdrop-filter:blur(20px);border-radius:20px;padding:24px;width:100%;max-width:300px;text-align:center}

/* Success Popup */
#successPopup{position:fixed;inset:0;z-index:10001;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;padding:24px}
#successPopup .modal-card{background:var(--card);backdrop-filter:blur(20px);border-radius:20px;padding:30px 24px;width:100%;max-width:320px;text-align:center}

.empty-state{text-align:center;padding:40px 20px;color:var(--text2)}
.empty-state .emoji{font-size:50px;margin-bottom:12px}

.sub-header{display:flex;align-items:center;gap:12px;padding:16px 0}
.sub-header button{background:none;border:none;font-size:22px;cursor:pointer;color:var(--text)}
.sub-header h2{font-family:'Orbitron',sans-serif;font-size:14px}
</style>
</head>
<body>

<!-- Toast Container -->
<div id="toastC"></div>

<!-- Loading Screen -->
<div id="loadScreen">
<img src="https://i.ibb.co/SXQSYV2s/file-000000000c3471fa832b723d62fd89b8.png" alt="Logo">
<h1>RUSIYA MODZ</h1>
<p>OFFICIAL STORE</p>
<div class="progress-bar"><div class="progress-fill" id="loadBar"></div></div>
</div>

<!-- Registration -->
<div id="regScreen">
<img src="https://i.ibb.co/SXQSYV2s/file-000000000c3471fa832b723d62fd89b8.png" alt="Logo" style="width:70px;height:70px;border-radius:50%">
<h2 class="orb" style="font-size:16px;margin-top:10px;color:var(--purple)">RUSIYA MODZ</h2>
<div class="step-indicator" id="regStepInd">
<div class="step-dot active" id="rsd1"></div>
<div class="step-line" id="rsl1"></div>
<div class="step-dot" id="rsd2"></div>
</div>
<div class="reg-card glass" id="regStep1">

<span class="qty-num">${qty}</span>
<button class="qty-btn" onclick="A.${prefix}AddItem('${key}')">+</button>
</div></div>`;
});
// Cart summary
let total=A.cartTotal(cart,itemGroups);
let citems=A.resolveCart(cart,itemGroups);
h+=`<div class="cart-summary glass">`;
if(citems.length>0){
citems.forEach(ci=>{h+=`<div style="font-size:12px;display:flex;justify-content:space-between"><span>${ci.n} x${ci.qty}</span><span>Rs.${ci.qty*ci.p}</span></div>`;});

<button class="btn btn-purple" onclick="A.${prefix}Next2()" style="width:auto;padding:10px 24px">Next →</button>
</div></div>`;
return h;
};

A.resolveCart=(cart,groups)=>{
let items=[];
Object.keys(cart).forEach(key=>{
if(cart[key]>0){
let [cat,...rest]=key.split('_');
let idx=parseInt(rest.join('_'));
let it=groups[cat][idx];
items.push({n:it.n,p:it.p,qty:cart[key]});
}
});
return items;
};
A.cartTotal=(cart,groups)=>{
let t=0;
Object.keys(cart).forEach(key=>{
if(cart[key]>0){
let [cat,...rest]=key.split('_');
let idx=parseInt(rest.join('_'));
t+=groups[cat][idx].p*cart[key];
}
});
return t;
};

},30000);
};

A.checkPendingOrders=()=>{
let orders=A.getOrders();
let now=Date.now();
let changed=false;
orders.forEach(o=>{
if(o.status==='pending'){
let elapsed=now-new Date(o.date).getTime();
if(elapsed>=30000){o.status='complete';changed=true;}
else{setTimeout(()=>{let ords=A.getOrders();let ord=ords.find(x=>x.id===o.id);if(ord&&ord.status==='pending'){ord.status='complete';A.saveOrders(ords);A.toast('Order #'+ord.id+' completed!','green');if(A.currentTab===2)A.renderHistory();}},30000-elapsed);}
}
});
if(changed)A.saveOrders(orders);
};

A.startOfferTimer=()=>{
if(A.offerTimerIv)clearInterval(A.offerTimerIv);
let targetDate=new Date('2026-07-19T07:00:00+05:30');
let targetEnd=new Date('2026-07-19T20:00:00+05:30');
A.offerTimerIv=setInterval(()=>{
let el=document.getElementById('offerCountdown');
if(!el){clearInterval(A.offerTimerIv);A.offerTimerIv=null;return;}
let now=new Date();
let target=now<targetDate?targetDate:targetEnd;
let diff=target-now;
if(diff<=0){el.textContent='00:00:00';clearInterval(A.offerTimerIv);return;}
let hrs=Math.floor(diff/3600000);
let mins=Math.floor((diff%3600000)/60000);
let secs=Math.floor((diff%60000)/1000);
el.textContent=String(hrs).padStart(2,'0')+':'+String(mins).padStart(2,'0')+':'+String(secs).padStart(2,'0');
},1000);
};

A.claimOfferCode=()=>{

};

A.isDayClaimed=()=>{
let de=A.getDailyEvent();
let today=new Date().toDateString();
return de.lastClaim===today;
};

}
};

A.checkVPN=(cb)=>{
A.toast('Checking connection...','purple');
let ctrl=new AbortController();
let tid=setTimeout(()=>{ctrl.abort();cb();},5000);
fetch('https://ipapi.co/json/',{signal:ctrl.signal}).then(r=>r.json()).then(data=>{
clearTimeout(tid);
let org=(data.org||'').toLowerCase();
if(org.includes('vpn')||org.includes('proxy')||org.includes('hosting')||org.includes('cloud')||org.includes('server')){
document.getElementById('vpnWarn').style.display='flex';
}else{cb();}
}).catch(()=>{clearTimeout(tid);cb();});
};

A.vpnGoBack=()=>{
document.getElementById('vpnWarn').style.display='none';
A.renderOffer(document.getElementById('pgWallet'));
};

A.renderDailyEvent=()=>{
let pg=document.getElementById('pgWallet');
let de=A.getDailyEvent();
let today=new Date().toDateString();
let stepsCompleted=de.lastClaim===today?(de.stepsCompleted||[]):[];
if(de.lastClaim!==today){de.stepsToday=0;de.stepsCompleted=[];stepsCompleted=[];}

let h=`<div class="sub-header"><button onclick="A.renderOffer(document.getElementById('pgWallet'))">←</button><h2>Daily Event</h2></div>
<div class="glass" style="padding:20px;text-align:center">
<h3 style="font-size:14px">Day ${de.totalDays+1} of 29</h3>
<p style="font-size:12px;color:var(--text2);margin:4px 0">Complete 10 steps to earn Rs.6.90</p>
<div class="event-progress"><div class="fill" style="width:${(stepsCompleted.length/10)*100}%"></div></div>
<p style="font-size:12px">${stepsCompleted.length}/10 steps completed</p>
</div>
<div class="step-grid" style="margin-top:16px">`;

for(let i=0;i<10;i++){
let done=stepsCompleted.includes(i);
let isCurrent=!done&&stepsCompleted.length===i;
let locked=!done&&!isCurrent;
h+=`<div class="step-item${done?' done':isCurrent?' current':' locked'}" ${isCurrent?`onclick="A.doStep(${i})"`:''}>${done?'✅':isCurrent?'▶️':'🔒'}<br>${i+1}</div>`;
}
h+=`</div>`;
pg.innerHTML=h;
};

A.doStep=(i)=>{
// Re-check VPN before each step
A.checkVPN(()=>{
window.open(A.MONETAG_LINKS[i],'_blank');
A.toast('Complete the task... (3s)','purple');
setTimeout(()=>{
let de=A.getDailyEvent();
let today=new Date().toDateString();
if(de.lastClaim!==today){de.stepsCompleted=[];de.stepsToday=0;}
if(!de.stepsCompleted)de.stepsCompleted=[];
if(!de.stepsCompleted.includes(i)){
de.stepsCompleted.push(i);
de.stepsToday=(de.stepsCompleted||[]).length;
if(de.stepsCompleted.length>=10){
de.totalDays++;
de.lastClaim=today;
A.saveDailyEvent(de);
A.setBal('offer_balance',A.getBal('offer_balance')+6.90);
A.toast('Day completed! Rs.6.90 earned!','green');
A.renderOffer(document.getElementById('pgWallet'));
return;
}
A.saveDailyEvent(de);
}
A.renderDailyEvent();
},3000);
});
};

pg.innerHTML=`<div class="empty-state" style="margin-top:40px"><div class="emoji">📭</div><h3>No Orders Yet</h3><p style="font-size:12px">Your orders will appear here</p></div>`;

}
let h=`<h3 class="section-title" style="margin-top:16px">📋 Order History</h3>`;

<span class="type">${o.type}</span>

<p class="items">${itemStr}</p>
${o.uid?`<p class="meta">UID: ${o.uid}</p>`:''}

<div style="display:flex;justify-content:space-between;margin-top:6px">

// ===== SETTINGS =====
A.settingsView='main';

if(A.settingsView==='main'){
let theme=A.LS.get('theme','light');
pg.innerHTML=`
<h3 class="section-title" style="margin-top:16px">⚙️ Settings</h3>
<div class="settings-section"><h3>Wallets</h3>
<div class="settings-item" onclick="A.walletView='hnb';A.goTab(1)"><div class="left"><span>🏦</span><div><h4>HNB Bank</h4></div></div><span class="arrow">→</span></div>
<div class="settings-item" onclick="A.walletView='ez';A.goTab(1)"><div class="left"><span>📱</span><div><h4>EZ Cash</h4></div></div><span class="arrow">→</span></div>
<div class="settings-item" onclick="A.walletView='offer';A.goTab(1)"><div class="left"><span>🎁</span><div><h4>Offer Wallet</h4></div></div><span class="arrow">→</span></div>
</div>
<div class="settings-section"><h3>Account</h3>
<div class="settings-item" onclick="A.goTab(2)"><div class="left"><span>📋</span><div><h4>History</h4></div></div><span class="arrow">→</span></div>

</div>
<div class="settings-section"><h3>VPN</h3>
<div class="settings-item" onclick="window.open('https://www.rusiyamodhjjfz.giize.com/','_blank')"><div class="left"><span>📲</span><div><h4>VPN Apps</h4><p>Download the recommended VPN apps for your device</p></div></div><span class="arrow">→</span></div>
</div>
<div class="settings-section"><h3>Backup</h3>
<div class="settings-item" onclick="A.downloadBackup()"><div class="left"><span>📥</span><div><h4>Download Backup</h4></div></div><span class="arrow">→</span></div>

</div>
<div class="settings-section"><h3>Theme</h3>
<div class="theme-toggles">
<button class="theme-btn${theme==='light'?' active':''}" onclick="A.applyTheme('light');A.renderSettings()">☀️ Light</button>
<button class="theme-btn${theme==='dark'?' active':''}" onclick="A.applyTheme('dark');A.renderSettings()">🌙 Dark</button>
<button class="theme-btn${theme==='rgb'?' active':''}" onclick="A.applyTheme('rgb');A.renderSettings()">🌈 RGB</button>
</div></div>
<button class="btn btn-red" onclick="A.logout()" style="margin-top:20px">🚪 Logout</button>`;
}else if(A.settingsView==='account'){
A.renderAccountDetails(pg);
}else if(A.settingsView==='changepin'){
A.renderChangePin(pg);
}
};

pg.innerHTML=`

A.renderChangePin=(pg)=>{
pg.innerHTML=`
<div class="sub-header"><button onclick="A.settingsView='main';A.renderSettings()">←</button><h2>Change PIN</h2></div>
<div class="glass" style="padding:24px">
<div class="input-group"><label>Current PIN</label>
<input type="tel" inputmode="numeric" class="ref-input" id="curPin" placeholder="Current PIN" maxlength="4" oninput="this.value=this.value.replace(/[^0-9]/g,'')"></div>
<div class="input-group"><label>New PIN</label>
<input type="tel" inputmode="numeric" class="ref-input" id="newPin" placeholder="New PIN" maxlength="4" oninput="this.value=this.value.replace(/[^0-9]/g,'')"></div>
<div class="input-group"><label>Confirm New PIN</label>
<input type="tel" inputmode="numeric" class="ref-input" id="confPin" placeholder="Confirm PIN" maxlength="4" oninput="this.value=this.value.replace(/[^0-9]/g,'')"></div>
<button class="btn btn-purple" onclick="A.changePin()">🔑 Change PIN</button>
</div>`;
};

A.changePin=()=>{
let cur=document.getElementById('curPin').value;
let np=document.getElementById('newPin').value;
let cp=document.getElementById('confPin').value;
let u=A.getUser();
if(cur!==u.pin){A.toast('Current PIN is wrong','red');return;}
if(!/^\d{4}$/.test(np)){A.toast('New PIN must be 4 digits','red');return;}
if(np!==cp){A.toast('PINs do not match','red');return;}
u.pin=np;
A.LS.set('user',u);
A.toast('PIN changed successfully!','green');
A.settingsView='main';A.renderSettings();
};

A.downloadBackup=()=>{
let data={};
for(let i=0;i<localStorage.length;i++){
let key=localStorage.key(i);
data[key]=localStorage.getItem(key);
}
let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
let a=document.createElement('a');
a.href=URL.createObjectURL(blob);
a.download='rusiya_modz_backup_'+Date.now()+'.json';
a.click();
A.toast('Backup downloaded!','green');
};

A.restoreBackup=(e)=>{
let f=e.target.files[0];if(!f)return;
let r=new FileReader();
r.onload=(ev)=>{
try{
let data=JSON.parse(ev.target.result);
Object.keys(data).forEach(k=>{localStorage.setItem(k,data[k]);});
A.toast('Backup restored! Reloading...','green');
setTimeout(()=>location.reload(),1500);
}catch(err){A.toast('Invalid backup file','red');}
};
r.readAsText(f);
e.target.value='';
};

A.logout=()=>{
A.showConfirm('Logout','Are you sure you want to logout? All data will be cleared.',()=>{
localStorage.clear();
location.reload();
});
};

// ===== INIT =====
window.addEventListener('DOMContentLoaded',A.init);
</script>
