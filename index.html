<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="monetag" content="cb18c347f4b726e68fcaf8e16038828e">
<title>RUSIYA MODZ - Official Store</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f0f2f5;--card:rgba(255,255,255,0.7);--text:#1a1a2e;--text2:#555;--border:rgba(138,92,255,0.2);--purple:#8A5CFF;--blue:#3B82F6;--green:#22C55E;--red:#EF4444;--yellow:#FBBF24;--cyan:#06B6D4;--pink:#EC4899;--header-bg:rgba(255,255,255,0.85);--nav-bg:rgba(255,255,255,0.92)}
[data-theme="dark"]{--bg:#050816;--card:rgba(20,20,40,0.7);--text:#e2e8f0;--text2:#94a3b8;--border:rgba(138,92,255,0.3);--header-bg:rgba(10,10,30,0.85);--nav-bg:rgba(10,10,30,0.92)}
[data-theme="rgb"]{--bg:#050816;--card:rgba(20,20,40,0.7);--text:#e2e8f0;--text2:#94a3b8;--border:rgba(138,92,255,0.3);--header-bg:rgba(10,10,30,0.85);--nav-bg:rgba(10,10,30,0.92)}
body{font-family:'Poppins',sans-serif;background:var(--bg);color:var(--text);max-width:480px;margin:0 auto;min-height:100vh;overflow-x:hidden;transition:background 0.4s,color 0.4s}
.orbitron{font-family:'Orbitron',monospace}
.glass{background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:20px}
@keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:0.85}}
@keyframes logoPulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 10px rgba(138,92,255,0.4))}50%{transform:scale(1.06);filter:drop-shadow(0 0 25px rgba(138,92,255,0.7))}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{0%,100%{box-shadow:0 0 5px var(--cyan),0 0 15px rgba(6,182,212,0.3)}50%{box-shadow:0 0 15px var(--cyan),0 0 35px rgba(6,182,212,0.5)}}
@keyframes rgbBorder{0%{border-color:#8A5CFF}25%{border-color:#3B82F6}50%{border-color:#22C55E}75%{border-color:#EC4899}100%{border-color:#8A5CFF}}
@keyframes toastIn{0%{transform:translateX(-50%) translateY(-100%) scale(0.8);opacity:0}100%{transform:translateX(-50%) translateY(0) scale(1);opacity:1}}
@keyframes toastOut{0%{transform:translateX(-50%) translateY(0) scale(1);opacity:1}100%{transform:translateX(-50%) translateY(-100%) scale(0.8);opacity:0}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes dotPulse{0%,100%{opacity:0.3}50%{opacity:1}}
@keyframes progressSlide{0%{width:0%}100%{width:100%}}
@keyframes whatsappPulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,0.7)}70%{box-shadow:0 0 0 15px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
@keyframes floatUp{0%{opacity:0;transform:translateY(15px)}100%{opacity:1;transform:translateY(0)}}
@keyframes subtitleFade{0%{opacity:0;letter-spacing:8px}100%{opacity:1;letter-spacing:4px}}
[data-theme="rgb"] .glass{animation:rgbBorder 3s linear infinite}
.fade-up{animation:fadeUp 0.5s ease forwards}
button{cursor:pointer;border:none;outline:none;font-family:'Poppins',sans-serif;transition:transform 0.15s}
button:active{transform:scale(0.96)!important}
input,select{font-family:'Poppins',sans-serif;outline:none}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--purple);border-radius:4px}

/* ===== LOADING SCREEN ===== */
#loadingScreen{position:fixed;top:0;left:0;width:100%;height:100%;background:#ffffff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10000;transition:opacity 0.6s ease}
#loadingScreen.fade-out{opacity:0;pointer-events:none}
.loading-logo{width:90px;height:90px;border-radius:50%;animation:logoPulse 2s ease-in-out infinite;margin-bottom:24px;border:3px solid rgba(138,92,255,0.15)}
.loading-title{font-family:'Orbitron',monospace;color:#8A5CFF;font-size:26px;font-weight:900;margin-bottom:6px;letter-spacing:2px}
.loading-subtitle{color:#94a3b8;font-size:11px;letter-spacing:4px;margin-bottom:35px;text-transform:uppercase;animation:subtitleFade 1.5s ease forwards}
.loading-progress-wrap{width:220px;position:relative}
.loading-progress-bg{width:100%;height:4px;background:rgba(138,92,255,0.1);border-radius:4px;overflow:hidden}
.loading-progress-fill{height:100%;background:linear-gradient(90deg,#8A5CFF,#06B6D4,#8A5CFF);background-size:200% 100%;border-radius:4px;transition:width 0.4s ease;position:relative;animation:shimmer 2s linear infinite}
.loading-dot{position:absolute;right:-5px;top:50%;transform:translateY(-50%);width:10px;height:10px;background:#06B6D4;border-radius:50%;box-shadow:0 0 10px rgba(6,182,212,0.6),0 0 20px rgba(6,182,212,0.3)}
.loading-percent{font-family:'Orbitron',monospace;font-size:12px;color:#8A5CFF;text-align:center;margin-top:12px;font-weight:700}
.loading-dots{display:flex;gap:6px;margin-top:20px}
.loading-dots span{width:6px;height:6px;border-radius:50%;background:#8A5CFF}
.loading-dots span:nth-child(1){animation:dotPulse 1.2s 0s infinite}
.loading-dots span:nth-child(2){animation:dotPulse 1.2s 0.2s infinite}
.loading-dots span:nth-child(3){animation:dotPulse 1.2s 0.4s infinite}

/* ===== TOAST ===== */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:14px;color:#fff;font-size:13px;font-weight:500;z-index:99999;animation:toastIn 0.5s cubic-bezier(0.68,-0.55,0.265,1.55) forwards;max-width:90%;text-align:center;backdrop-filter:blur(10px);box-shadow:0 8px 25px rgba(0,0,0,0.15)}
.toast.hide{animation:toastOut 0.3s ease forwards}
.toast.info{background:rgba(138,92,255,0.92)}
.toast.success{background:rgba(34,197,94,0.92)}
.toast.error{background:rgba(239,68,68,0.92)}

/* ===== HEADER ===== */
#header{position:sticky;top:0;z-index:1000;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;background:var(--header-bg);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);border-bottom:1px solid var(--border)}
.header-left{display:flex;align-items:center;gap:10px}
.header-left img{width:36px;height:36px;border-radius:50%;border:2px solid rgba(138,92,255,0.3)}
.header-left .h-title{font-family:'Orbitron',monospace;font-size:14px;font-weight:700;color:var(--purple)}
.header-left .h-sub{font-size:9px;color:var(--text2);letter-spacing:1px}
.header-right{display:flex;align-items:center;gap:8px}
.header-right button{width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--border);color:var(--text);font-size:16px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px)}

/* ===== BOTTOM NAV ===== */
#bottomNav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:var(--nav-bg);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);border-top:1px solid var(--border);z-index:1000;padding:4px 0 env(safe-area-inset-bottom)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 0;color:var(--text2);font-size:10px;gap:2px;position:relative;transition:color 0.3s}
.nav-item.active{color:var(--purple)}
.nav-item.active::before{content:'';position:absolute;top:0;width:30px;height:3px;background:linear-gradient(90deg,var(--purple),var(--cyan));border-radius:0 0 3px 3px}
.nav-item span{font-size:20px}

/* ===== WHATSAPP FLOAT ===== */
#waFloat{position:fixed;bottom:75px;right:15px;width:55px;height:55px;background:linear-gradient(135deg,#22C55E,#16a34a);border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:999;font-size:28px;color:#fff;text-decoration:none;animation:whatsappPulse 2s infinite;box-shadow:0 4px 20px rgba(34,197,94,0.4)}

/* ===== PAGES ===== */
.page{display:none;padding:15px;padding-bottom:85px;padding-top:10px}
.page.active{display:block}

/* ===== INPUTS ===== */
.input-group{margin-bottom:15px}
.input-group label{display:block;font-size:12px;color:var(--text2);margin-bottom:6px;font-weight:500}
.input-group input,.input-group select{width:100%;padding:12px 16px;border-radius:14px;border:1.5px solid var(--border);background:var(--card);color:var(--text);font-size:14px;backdrop-filter:blur(10px);transition:border-color 0.3s,box-shadow 0.3s}
.input-group input:focus,.input-group select:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(138,92,255,0.1)}

/* ===== BUTTONS ===== */
.btn{width:100%;padding:14px;border-radius:14px;font-size:14px;font-weight:600;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform 0.15s,box-shadow 0.3s}
.btn-purple{background:linear-gradient(135deg,#8A5CFF,#6C3AE0);box-shadow:0 4px 15px rgba(138,92,255,0.3)}
.btn-green{background:linear-gradient(135deg,#22C55E,#16a34a);box-shadow:0 4px 15px rgba(34,197,94,0.3)}
.btn-red{background:linear-gradient(135deg,#EF4444,#dc2626);box-shadow:0 4px 15px rgba(239,68,68,0.3)}
.btn-blue{background:linear-gradient(135deg,#3B82F6,#2563eb);box-shadow:0 4px 15px rgba(59,130,246,0.3)}
.btn-cyan{background:linear-gradient(135deg,#06B6D4,#0891b2);box-shadow:0 4px 15px rgba(6,182,212,0.3)}
.btn-yellow{background:linear-gradient(135deg,#FBBF24,#d97706);color:#000;box-shadow:0 4px 15px rgba(251,191,36,0.3)}
.btn-outline{background:transparent;border:2px solid var(--purple);color:var(--purple)}
.btn-gray{background:rgba(100,100,100,0.3);color:var(--text2)}
.btn-sm{padding:10px 16px;font-size:12px;width:auto;border-radius:12px}
.btn:disabled{opacity:0.5;cursor:not-allowed}

/* ===== REGISTRATION ===== */
#regPage{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg);z-index:9999;display:none;overflow-y:auto}
.reg-container{max-width:480px;margin:0 auto;padding:30px 20px;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
.photo-upload{width:100px;height:100px;border-radius:50%;border:2.5px dashed var(--purple);display:flex;align-items:center;justify-content:center;margin-bottom:20px;cursor:pointer;overflow:hidden;position:relative;background:var(--card);transition:border-color 0.3s}
.photo-upload:hover{border-color:var(--cyan)}
.photo-upload img{width:100%;height:100%;object-fit:cover}
.photo-upload span{font-size:36px;color:var(--purple)}
.pin-boxes{display:flex;gap:12px;justify-content:center;margin:20px 0}
.pin-box{width:50px;height:55px;border-radius:14px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:24px;text-align:center;font-family:'Orbitron',monospace;-webkit-text-security:disc;transition:border-color 0.3s}
.pin-box:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(138,92,255,0.15)}

/* ===== HOME CARDS ===== */
.welcome-banner{padding:22px;margin-bottom:15px;background:linear-gradient(135deg,rgba(138,92,255,0.12),rgba(59,130,246,0.12))}
.welcome-banner h2{font-size:16px;margin-bottom:3px}
.welcome-banner p{font-size:12px;color:var(--text2)}
.section-title{font-family:'Orbitron',monospace;font-size:13px;margin:20px 0 12px;color:var(--purple);letter-spacing:1px}
.store-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.store-card{padding:0;overflow:hidden;cursor:pointer;position:relative;transition:transform 0.3s}
.store-card:active{transform:scale(0.96)}
.store-card img{width:100%;height:110px;object-fit:cover}
.store-card .card-body{padding:10px}
.store-card .card-title{font-size:12px;font-weight:600}
.store-card .card-sub{font-size:10px;color:var(--text2)}
.badge{position:absolute;top:8px;right:8px;padding:3px 10px;border-radius:10px;font-size:9px;font-weight:700;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,0.15)}
.badge-hot{background:linear-gradient(135deg,#EF4444,#dc2626)}
.badge-top{background:linear-gradient(135deg,#FBBF24,#f59e0b);color:#000}
.badge-lock{background:linear-gradient(135deg,#8A5CFF,#6C3AE0)}
.badge-free{background:linear-gradient(135deg,#22C55E,#16a34a)}
.badge-premium{background:linear-gradient(135deg,#8A5CFF,#EC4899)}
.badge-v2ray{background:linear-gradient(135deg,#06B6D4,#8A5CFF)}
.badge-support{background:linear-gradient(135deg,#3B82F6,#1d4ed8)}
.single-card{grid-column:1/-1}

/* ===== STORE PAGES ===== */
.store-header{display:flex;align-items:center;gap:10px;margin-bottom:15px}
.store-header .back-btn{width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--border);color:var(--text);font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.step-bar{display:flex;gap:5px;margin-bottom:20px}
.step-dot{flex:1;height:4px;border-radius:4px;background:rgba(138,92,255,0.15);transition:background 0.3s}
.step-dot.active{background:linear-gradient(90deg,var(--purple),var(--cyan))}
.step-dot.done{background:var(--green)}
.cat-tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:15px;padding-bottom:5px;-ms-overflow-style:none;scrollbar-width:none}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-tab{padding:8px 18px;border-radius:20px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--card);border:1.5px solid var(--border);color:var(--text2);transition:all 0.3s}
.cat-tab.active{background:var(--purple);color:#fff;border-color:var(--purple);box-shadow:0 4px 12px rgba(138,92,255,0.3)}
.item-card{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:10px}
.item-card img{width:52px;height:52px;border-radius:14px;object-fit:cover}
.item-info{flex:1}
.item-info h4{font-size:13px;font-weight:600}
.item-info .price{font-size:14px;font-weight:700;color:var(--purple)}
.item-info .old-price{font-size:11px;color:var(--text2);text-decoration:line-through;margin-left:5px}
.qty-ctrl{display:flex;align-items:center;gap:8px}
.qty-btn{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--purple),#6C3AE0);color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(138,92,255,0.25)}
.qty-num{font-size:14px;font-weight:700;min-width:20px;text-align:center}
.cart-summary{position:sticky;bottom:70px;padding:15px;margin-top:15px;display:flex;align-items:center;justify-content:space-between}
.cart-summary .total{font-size:18px;font-weight:700;color:var(--purple);font-family:'Orbitron',monospace}
.cart-summary .items-count{font-size:11px;color:var(--text2)}
.payment-card{padding:15px;margin-bottom:10px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all 0.3s}
.payment-card.selected{border-color:var(--purple);box-shadow:0 0 0 3px rgba(138,92,255,0.15);background:rgba(138,92,255,0.05)}
.payment-card img{width:42px;height:42px;border-radius:12px;object-fit:cover}
.payment-card .pay-name{font-size:13px;font-weight:600}
.payment-card .pay-bal{font-size:11px;color:var(--text2)}
.order-summary{padding:18px}
.order-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.order-row:last-child{border:none;font-weight:700;color:var(--purple);font-size:15px}
.order-status{display:inline-block;padding:3px 10px;border-radius:8px;font-size:11px;font-weight:600}
.status-pending{background:rgba(251,191,36,0.15);color:var(--yellow)}
.status-complete{background:rgba(34,197,94,0.15);color:var(--green)}

/* ===== PIN MODAL ===== */
#pinModal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);backdrop-filter:blur(15px);display:none;align-items:center;justify-content:center;z-index:9998}
#pinModal .modal-content{width:90%;max-width:350px;padding:30px;text-align:center}
#pinModal h3{font-family:'Orbitron',monospace;font-size:16px;margin-bottom:5px}
#pinModal .pin-subtitle{font-size:12px;color:var(--text2);margin-bottom:20px}
.pin-error{color:var(--red);font-size:12px;margin-top:10px;display:none}
.modal-buttons{display:flex;gap:10px;margin-top:20px}
.modal-buttons button{flex:1}

/* ===== WALLET ===== */
.wallet-card{padding:22px;margin-bottom:12px;position:relative;overflow:hidden;color:#fff}
.wallet-card::before{content:'';position:absolute;top:-40%;right:-30%;width:120px;height:120px;background:radial-gradient(circle,rgba(255,255,255,0.12),transparent);border-radius:50%}
.wallet-card.hnb{background:linear-gradient(135deg,#3B82F6,#1d4ed8)}
.wallet-card.ez{background:linear-gradient(135deg,#EF4444,#b91c1c)}
.wallet-card.offer{background:linear-gradient(135deg,#8A5CFF,#EC4899)}
.wallet-card h3{font-family:'Orbitron',monospace;font-size:13px;opacity:0.9}
.wallet-card .balance{font-family:'Orbitron',monospace;font-size:26px;margin:8px 0;font-weight:900}
.wallet-card .bal-label{font-size:11px;opacity:0.8}
.wallet-card img{position:absolute;top:15px;right:15px;width:40px;height:40px;border-radius:12px;opacity:0.7}

.deposit-section{padding:20px;margin-bottom:15px}
.deposit-section h4{font-size:14px;margin-bottom:12px}
.masked-input{-webkit-text-security:disc;font-size:16px}

/* ===== OFFER WALLET ===== */
.offer-section{padding:16px;margin-bottom:12px}
.offer-section h4{font-size:13px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.countdown{font-family:'Orbitron',monospace;font-size:20px;color:var(--cyan);text-align:center;margin:15px 0}
.daily-progress{display:flex;gap:3px;margin:10px 0;flex-wrap:wrap}
.daily-dot{width:20px;height:20px;border-radius:50%;background:rgba(138,92,255,0.15);display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:600}
.daily-dot.done{background:var(--green);color:#fff}
.daily-dot.current{background:var(--purple);color:#fff;animation:pulse 1.5s infinite}
.step-progress{margin:15px 0}
.step-progress .step-item{display:flex;align-items:center;gap:10px;padding:8px 0}
.step-progress .step-num{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.step-num.done{background:var(--green);color:#fff}
.step-num.current{background:var(--purple);color:#fff;animation:pulse 1.5s infinite}
.step-num.locked{background:rgba(138,92,255,0.12);color:var(--text2)}

/* ===== VPN ===== */
.vpn-card{padding:0;overflow:hidden;margin-bottom:12px;cursor:pointer}
.vpn-card img{width:100%;height:130px;object-fit:cover}
.vpn-card .card-body{padding:12px}
.vpn-type-badge{display:inline-block;padding:2px 8px;border-radius:8px;font-size:10px;font-weight:600;margin-right:4px}
.vpn-type-router{background:rgba(59,130,246,0.15);color:var(--blue)}
.vpn-type-sim{background:rgba(236,72,153,0.15);color:var(--pink)}
.vpn-type-lite{background:rgba(34,197,94,0.15);color:var(--green)}
.vpn-type-premium{background:rgba(138,92,255,0.15);color:var(--purple)}
.provider-badge{display:inline-block;padding:2px 8px;border-radius:8px;font-size:10px;font-weight:600;background:rgba(6,182,212,0.15);color:var(--cyan)}

.vpn-option{padding:16px;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:all 0.3s}
.vpn-option.selected{border-color:var(--purple);box-shadow:0 0 0 3px rgba(138,92,255,0.12);background:rgba(138,92,255,0.04)}
.vpn-option .check{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;flex-shrink:0;transition:all 0.3s}
.vpn-option.selected .check{background:var(--purple);border-color:var(--purple)}
.plan-card{padding:14px;margin-bottom:8px;cursor:pointer;transition:all 0.3s}
.plan-card.selected{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(6,182,212,0.12);background:rgba(6,182,212,0.04)}
.plan-card h5{font-size:12px;font-weight:600}
.plan-card .plan-price{font-size:15px;font-weight:700;color:var(--purple);font-family:'Orbitron',monospace}
.plan-card .plan-gb{font-size:11px;color:var(--cyan);font-weight:600}

/* ===== HISTORY ===== */
.history-item{padding:14px;margin-bottom:10px}
.history-item .h-type{font-size:11px;color:var(--purple);font-weight:600;text-transform:uppercase;letter-spacing:0.5px}

A.calcCount=function(cart){var c=0;for(var k in cart)c+=(cart[k]||0);return c};

A.subE=function(){var a=parseFloat(document.getElementById('ezAmt').value);var r=document.getElementById('ezRef').value.trim();if(!a||a<=0){A.toast('Enter valid amount','error');return}if(!r){A.toast('Enter reference','error');return}var ur=A.LS.get('usedRefs',[]);if(ur.indexOf(r)>=0){A.toast('Reference already used!','error');return}ur.push(r);A.LS.set('usedRefs',ur);var b=A.getBal('ez');A.setBal('ez',b+a);A.showSuccess('Deposit Submitted!','Rs '+a+' added to EZ Cash wallet.','Send to WhatsApp',function(){A.sendWA('📱 *RUSIYA MODZ EZ DEPOSIT*\nAmount: Rs '+a+'\nRef: RUSIYAMODZEZCASHGFGDH'+a)})};

// ========== OFFER WALLET ==========
var ofCT=null;
A.rOW=function(){var h='<div class="store-header"><button class="back-btn" onclick="A.goBack();if(ofCT)clearInterval(ofCT)">←</button><h3 class="orbitron" style="font-size:16px">Offer Wallet</h3></div>';h+='<div style="text-align:center;margin-bottom:15px"><div style="font-size:40px;margin-bottom:5px">🎁</div><div class="orbitron" style="font-size:26px;color:var(--purple)">Rs '+A.getBal('offer').toFixed(2)+'</div></div>';
// Offer Code
h+='<div class="offer-section glass fade-up"><h4>🎟️ Offer Code Event</h4>';var eD=new Date('2026-07-19T07:00:00+05:30');var eE=new Date('2026-07-19T20:00:00+05:30');var now=new Date();var cl=A.LS.get('offerCodeClaimed',false);if(now<eD){h+='<p style="font-size:12px;color:var(--text2)">July 19, 2026 • 7AM-8PM</p><div class="countdown" id="ofCD">Loading...</div><button class="btn btn-gray" disabled>⏳ Not Yet Available</button>'}else if(now>=eD&&now<=eE&&!cl){h+='<p style="font-size:12px;color:var(--green)">🟢 Event LIVE!</p><button class="btn btn-yellow" onclick="A.clOC()">🎉 GET CODE NOW</button>'}else if(cl){h+='<p style="font-size:12px;color:var(--green)">✅ Code claimed!</p>'}else{h+='<p style="font-size:12px;color:var(--red)">⏰ Expired</p>'}h+='</div>';
// Daily Event
h+='<div class="offer-section glass fade-up"><h4>📅 Daily Event</h4><p style="font-size:12px;color:var(--text2)">Earn Rs 6.90/day for 29 days (Total Rs 200)</p>';var dl=A.LS.get('dailyEvent',{totalDays:0,todaySteps:0,lastDate:''});var td=new Date().toDateString();if(dl.lastDate!==td){dl.todaySteps=0;dl.lastDate=td;A.LS.set('dailyEvent',dl)}h+='<div class="daily-progress">';for(var i=0;i<29;i++){var c=i<dl.totalDays?'done':i===dl.totalDays?'current':'';h+='<div class="daily-dot '+c+'">'+(i+1)+'</div>'}h+='</div><p style="font-size:11px;color:var(--text2);margin:5px 0">Days: '+dl.totalDays+'/29 • Steps: '+dl.todaySteps+'/10</p>';if(dl.totalDays>=29){h+='<p style="color:var(--green);font-weight:600">🎉 All 29 days completed!</p>'}else if(dl.todaySteps>=10){h+='<p style="color:var(--green);font-weight:600">✅ Today done! +Rs 6.90</p>'}else{h+='<div class="step-progress">';for(var i=0;i<10;i++){var c=i<dl.todaySteps?'done':i===dl.todaySteps?'current':'locked';h+='<div class="step-item"><div class="step-num '+c+'">'+(i+1)+'</div><div style="flex:1;font-size:12px">Step '+(i+1)+'</div>';if(i===dl.todaySteps)h+='<button class="btn btn-purple btn-sm" onclick="A.doDS('+i+')">GO →</button>';else if(i<dl.todaySteps)h+='<span style="color:var(--green);font-size:12px">✅</span>';else h+='<span style="color:var(--text2);font-size:12px">🔒</span>';h+='</div>'}h+='</div>'}h+='</div>';
// Manual Code
h+='<div class="offer-section glass fade-up"><h4>🔑 Manual Code</h4><div class="input-group"><label>Enter Code</label><input type="text" id="mcInput" placeholder="Enter code"></div><button class="btn btn-purple" onclick="A.subMC()">Apply Code</button></div>';
document.getElementById('offerWalletPage').innerHTML=h;
if(now<eD){if(ofCT)clearInterval(ofCT);ofCT=setInterval(function(){var n=new Date();var df=eD-n;if(df<=0){clearInterval(ofCT);A.rOW();return}var d=Math.floor(df/86400000);var hr=Math.floor((df%86400000)/3600000);var mn=Math.floor((df%3600000)/60000);var sc=Math.floor((df%60000)/1000);var el=document.getElementById('ofCD');if(el)el.textContent=d+'d '+hr+'h '+mn+'m '+sc+'s'},1000)}};
A.clOC=function(){A.LS.set('offerCodeClaimed',true);window.open('https://stly.link/jfnnfn','_blank');A.toast('Offer code opened!','success');A.rOW()};
A.doDS=function(step){A.checkVPN(function(){var dl=A.LS.get('dailyEvent',{totalDays:0,todaySteps:0,lastDate:''});if(step!==dl.todaySteps)return;window.open(MONETAG_LINKS[step],'_blank');A.toast('Complete ad, wait 3 seconds...','info');setTimeout(function(){dl=A.LS.get('dailyEvent',{totalDays:0,todaySteps:0,lastDate:''});dl.todaySteps=step+1;if(dl.todaySteps>=10){var b=A.getBal('offer');A.setBal('offer',b+6.90);dl.totalDays++;A.toast('+Rs 6.90 added!','success')}A.LS.set('dailyEvent',dl);A.rOW()},3000)})};
A.checkVPN=function(cb){try{fetch('https://ipapi.co/json/').then(function(r){return r.json()}).then(function(d){var o=(d.org||'').toLowerCase();if(o.indexOf('vpn')>=0||o.indexOf('proxy')>=0||o.indexOf('hosting')>=0||o.indexOf('cloud')>=0||o.indexOf('server')>=0){document.getElementById('vpnWarning').style.display='flex'}else cb()}).catch(function(){cb()})}catch(e){cb()}};
A.recheckVPN=function(){document.getElementById('vpnWarning').style.display='none';A.toast('Re-checking...','info');A.checkVPN(function(){A.toast('No VPN detected!','success')})};
A.subMC=function(){var c=document.getElementById('mcInput').value.trim();if(c==='2009'){var u=A.LS.get('usedOffers',[]);if(u.indexOf('2009')>=0){A.toast('Code already used!','error');return}u.push('2009');A.LS.set('usedOffers',u);var b=A.getBal('offer');A.setBal('offer',b+160);A.toast('+Rs 160 added to Offer Wallet!','success');A.rOW()}else A.toast('Invalid code!','error')};

// ========== HISTORY ==========
A.renderHistory=function(){var os=A.getOrders().slice().reverse();var h='<div class="section-title fade-up">📋 ORDER HISTORY</div>';if(os.length===0)h+='<div class="empty-state"><span>📭</span><p>No orders yet</p></div>';else for(var i=0;i<os.length;i++){var o=os[i];h+='<div class="history-item glass fade-up"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px"><span class="h-type">'+o.type+'</span><span class="order-status '+(o.status==='pending'?'status-pending':'status-complete')+'">'+o.status.toUpperCase()+'</span></div>';if(o.items)h+='<div class="h-items">'+o.items.map(function(it){return it.name+' x'+it.qty}).join(', ')+'</div>';if(o.uid)h+='<div style="font-size:11px;color:var(--text2)">UID: '+o.uid+'</div>';if(o.vpnName)h+='<div style="font-size:11px;color:var(--text2)">VPN: '+o.vpnName+'</div>';var badges='';if(o.vpnProvider)badges+='<span class="provider-badge">'+o.vpnProvider+'</span> ';if(o.vpnType)badges+='<span class="vpn-type-badge vpn-type-'+o.vpnType+'">'+o.vpnType.toUpperCase()+'</span> ';if(o.gbAmount)badges+='<span style="font-size:11px;color:var(--cyan)">'+o.gbAmount+'GB</span>';if(badges)h+='<div style="margin-top:3px">'+badges+'</div>';h+='<div style="display:flex;justify-content:space-between;margin-top:8px"><span class="h-date">'+new Date(o.date).toLocaleString()+'</span><span class="h-total">Rs '+o.total+'</span></div></div>'}document.getElementById('historyPage').innerHTML=h};

// ========== SETTINGS ==========
A.renderSettings=function(){var h='<div class="section-title fade-up">⚙️ SETTINGS</div>';
h+='<div class="settings-group fade-up"><h4>Wallets</h4><div class="settings-item glass" onclick="A.goPage(\'depositHnb\');A.rDH()"><div class="s-left"><span class="s-icon">🏦</span><span class="s-name">HNB Bank</span></div><span class="s-arrow">→</span></div><div class="settings-item glass" onclick="A.goPage(\'depositEz\');A.rDE()"><div class="s-left"><span class="s-icon">📱</span><span class="s-name">EZ Cash</span></div><span class="s-arrow">→</span></div><div class="settings-item glass" onclick="A.goPage(\'offerWallet\');A.rOW()"><div class="s-left"><span class="s-icon">🎁</span><span class="s-name">Offer Wallet</span></div><span class="s-arrow">→</span></div></div>';
h+='<div class="settings-group fade-up"><h4>Account</h4><div class="settings-item glass" onclick="A.goPage(\'history\')"><div class="s-left"><span class="s-icon">📋</span><span class="s-name">Order History</span></div><span class="s-arrow">→</span></div><div class="settings-item glass" onclick="A.goPage(\'accountDetails\');A.rAD()"><div class="s-left"><span class="s-icon">👤</span><span class="s-name">Account Details</span></div><span class="s-arrow">→</span></div><div class="settings-item glass" onclick="A.goPage(\'changePin\');A.rCP()"><div class="s-left"><span class="s-icon">🔐</span><span class="s-name">Change PIN</span></div><span class="s-arrow">→</span></div></div>';
h+='<div class="settings-group fade-up"><h4>VPN</h4><div class="settings-item glass" onclick="window.open(\'https://www.rusiyamodhjjfz.giize.com/\',\'_blank\')"><div class="s-left"><span class="s-icon">📲</span><span class="s-name">VPN Apps</span></div><span class="s-arrow">→</span></div></div>';
h+='<div class="settings-group fade-up"><h4>Backup</h4><div class="settings-item glass" onclick="A.dlBK()"><div class="s-left"><span class="s-icon">💾</span><span class="s-name">Download Backup</span></div><span class="s-arrow">→</span></div><div class="settings-item glass" onclick="document.getElementById(\'rInput\').click()"><div class="s-left"><span class="s-icon">📂</span><span class="s-name">Restore Backup</span></div><span class="s-arrow">→</span></div><input type="file" id="rInput" accept=".json" style="display:none" onchange="A.rsBK(this)"></div>';
h+='<div class="settings-group fade-up"><h4>Theme</h4><div class="theme-toggles"><div class="theme-btn glass '+(A.currentTheme==='light'?'active':'')+'" onclick="A.setTheme(\'light\');A.renderSettings()">☀️ Light</div><div class="theme-btn glass '+(A.currentTheme==='dark'?'active':'')+'" onclick="A.setTheme(\'dark\');A.renderSettings()">🌙 Dark</div><div class="theme-btn glass '+(A.currentTheme==='rgb'?'active':'')+'" onclick="A.setTheme(\'rgb\');A.renderSettings()">🌈 RGB</div></div></div>';
h+='<div class="settings-group fade-up"><button class="btn btn-red" onclick="A.showConfirm(\'Logout\',\'Are you sure you want to logout?\',A.doLogout)">🚪 Logout</button></div>';
document.getElementById('settingsPage').innerHTML=h};
A.doLogout=function(){localStorage.clear();location.reload()};

// Account Details
A.rAD=function(){var u=A.getUser();var dl=A.LS.get('dailyEvent',{totalDays:0});var h='<div class="store-header"><button class="back-btn" onclick="A.goBack()">←</button><h3 class="orbitron" style="font-size:16px">Account Details</h3></div><div class="account-card glass fade-up"><img src="'+(u.photo||'https://i.ibb.co/SXQSYV2s/file-000000000c3471fa832b723d62fd89b8.png')+'" alt=""><h3>'+u.name+'</h3><p>📱 '+u.mobile+'</p><div class="balance-grid"><div class="bal-item"><div class="bal-amt">'+A.getBal('hnb').toFixed(0)+'</div><div class="bal-lbl">HNB</div></div><div class="bal-item"><div class="bal-amt">'+A.getBal('ez').toFixed(0)+'</div><div class="bal-lbl">EZ Cash</div></div><div class="bal-item"><div class="bal-amt">'+A.getBal('offer').toFixed(0)+'</div><div class="bal-lbl">Offer</div></div></div><p style="font-size:11px;color:var(--text2);margin-top:12px">Daily Progress: '+dl.totalDays+'/29 days</p></div>';document.getElementById('accountDetailsPage').innerHTML=h};

// Change PIN
A.rCP=function(){var h='<div class="store-header"><button class="back-btn" onclick="A.goBack()">←</button><h3 class="orbitron" style="font-size:16px">Change PIN</h3></div><div class="glass fade-up" style="padding:28px;text-align:center"><div style="font-size:40px;margin-bottom:12px">🔐</div><p style="font-size:12px;color:var(--text2);margin-bottom:20px">Enter new 4-digit PIN</p><div class="pin-boxes" id="cpBoxes"><input type="tel" inputmode="numeric" class="pin-box" maxlength="1"><input type="tel" inputmode="numeric" class="pin-box" maxlength="1"><input type="tel" inputmode="numeric" class="pin-box" maxlength="1"><input type="tel" inputmode="numeric" class="pin-box" maxlength="1"></div><button class="btn btn-purple" style="margin-top:15px" onclick="A.saveNP()">Save New PIN</button></div>';document.getElementById('changePinPage').innerHTML=h;setTimeout(function(){var bs=document.querySelectorAll('#cpBoxes .pin-box');for(var i=0;i<bs.length;i++){bs[i].addEventListener('input',function(e){e.target.value=e.target.value.replace(/[^0-9]/g,'');if(e.target.value&&e.target.nextElementSibling)e.target.nextElementSibling.focus()});bs[i].addEventListener('keydown',function(e){if(e.key==='Backspace'&&!e.target.value&&e.target.previousElementSibling){e.target.previousElementSibling.focus();e.target.previousElementSibling.value=''}})}},50)};
A.saveNP=function(){var bs=document.querySelectorAll('#cpBoxes .pin-box');var p='';for(var i=0;i<bs.length;i++)p+=bs[i].value;p=p.replace(/[^0-9]/g,'');if(!/^\d{4}$/.test(p)){A.toast('PIN must be exactly 4 digits','error');return}var u=A.getUser();u.pin=p;A.setUser(u);A.toast('PIN changed!','success');A.goBack()};

// Backup
A.dlBK=function(){var data={};var ks=['user','hnb_balance','ez_balance','offer_balance','orders','usedRefs','usedOffers','dailyEvent','theme','offerCodeClaimed','device_id'];for(var i=0;i<ks.length;i++)data[ks[i]]=A.LS.get(ks[i],null);var bl=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='rusiya_modz_backup_'+Date.now()+'.json';a.click();A.toast('Backup downloaded!','success')};
A.rsBK=function(inp){if(!inp.files||!inp.files[0])return;var r=new FileReader();r.onload=function(e){try{var d=JSON.parse(e.target.result);for(var k in d)if(d[k]!==null)A.LS.set(k,d[k]);A.toast('Restored! Reloading...','success');setTimeout(function(){location.reload()},1500)}catch(x){A.toast('Invalid file!','error')}};r.readAsText(inp.files[0])};

// ========== INIT ==========
document.addEventListener('DOMContentLoaded',function(){A.initLoading()});
</script>
